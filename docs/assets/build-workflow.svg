<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title desc">
<title id="title">Framework Desktop AI Lab build workflow</title>
<desc id="desc">Six documented phases from compatibility research through capture testing, with restore point checkpoints after the baseline, network and Vulkan checks, HIP validation, and inference. Capture and sustained 1080p60 remain unverified.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d31"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
 <filter id="shadow" x="-12%" y="-15%" width="124%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".25"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#6f819e"/></marker>
 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.white{fill:#f4f7fb}.muted{fill:#a5b4ca}.tiny{font-size:14px;letter-spacing:.08em;font-weight:750}.step{font-size:14px;font-weight:800;letter-spacing:.1em}.title{font-size:22px;font-weight:720}.body{font-size:17px}</style>
</defs>
<rect width="960" height="1000" rx="24" fill="url(#bg)"/>
<rect x="32" y="30" width="5" height="48" rx="2.5" fill="url(#cyan)"/>
<text x="51" y="43" class="tiny" fill="#67e8f9">FRAMEWORK DESKTOP · AI LAB</text>
<text x="51" y="75" class="white" font-size="27" font-weight="750">A measured build, one layer at a time</text>
<text x="928" y="46" fill="#a5b4ca" font-size="12" text-anchor="end">DOCUMENTED PLAN · PHASES 0–6</text>
<text x="928" y="68" fill="#6e7f9c" font-size="12" text-anchor="end">Advance when each check is recorded</text>
<path d="M32 96H928" stroke="#26354d"/>

<!-- serpentine flow: across, down and back, then across -->
<path d="M462 205H490" stroke="#6f819e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M714 275V294H246V310" fill="none" stroke="#6f819e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M462 380H490" stroke="#6f819e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M714 450V469H246V485" fill="none" stroke="#6f819e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M462 555H490" stroke="#6f819e" stroke-width="2" marker-end="url(#arrow)"/>

<!-- 01 -->
<g filter="url(#shadow)"><rect x="32" y="135" width="430" height="140" rx="16" fill="#152238" stroke="#3b526f"/><rect x="32" y="135" width="430" height="3" rx="1.5" fill="#38bdf8"/></g>
<circle cx="61" cy="168" r="15" fill="#123f5b"/><text x="61" y="172" class="step" fill="#7dd3fc" text-anchor="middle">01</text>
<text x="87" y="173" class="tiny" fill="#7dd3fc">PHASE 0 · GATE</text>
<text x="54" y="211" class="title white">Compatibility research</text>
<text x="54" y="238" class="body muted">Confirm OS, kernel and AMD stack support.</text>
<text x="54" y="260" class="body" fill="#bae6fd">Freeze the version matrix before install.</text>
<!-- 02 -->
<g filter="url(#shadow)"><rect x="500" y="135" width="428" height="140" rx="16" fill="#152238" stroke="#3b526f"/><rect x="500" y="135" width="428" height="3" rx="1.5" fill="#38bdf8"/></g>
<circle cx="529" cy="168" r="15" fill="#123f5b"/><text x="529" y="172" class="step" fill="#7dd3fc" text-anchor="middle">02</text>
<text x="555" y="173" class="tiny" fill="#7dd3fc">PHASE 1</text>
<text x="522" y="211" class="title white">Clean Ubuntu baseline</text>
<text x="522" y="238" class="body muted">Verify ISO + target disk; record hardware.</text>
<rect x="522" y="247" width="62" height="20" rx="10" fill="#123e37"/><text x="553" y="262" class="tiny" fill="#6ee7b7" text-anchor="middle">RP0</text>
<!-- 03 -->
<g filter="url(#shadow)"><rect x="32" y="310" width="430" height="140" rx="16" fill="#152238" stroke="#3b526f"/><rect x="32" y="310" width="430" height="3" rx="1.5" fill="#38bdf8"/></g>
<circle cx="61" cy="343" r="15" fill="#123f5b"/><text x="61" y="347" class="step" fill="#7dd3fc" text-anchor="middle">03</text>
<text x="87" y="348" class="tiny" fill="#7dd3fc">PHASE 2</text>
<text x="54" y="386" class="title white">Network + Tailscale</text>
<text x="54" y="413" class="body muted">Check interfaces, drivers and link state.</text>
<text x="54" y="435" class="body muted">Confirm remote access from another device.</text>
<!-- 04 -->
<g filter="url(#shadow)"><rect x="500" y="310" width="428" height="140" rx="16" fill="#152238" stroke="#4c4374"/><rect x="500" y="310" width="428" height="3" rx="1.5" fill="#8b5cf6"/></g>
<circle cx="529" cy="343" r="15" fill="#31265a"/><text x="529" y="347" class="step" fill="#c4b5fd" text-anchor="middle">04</text>
<text x="555" y="348" class="tiny" fill="#c4b5fd">PHASES 3–4</text>
<text x="522" y="386" class="title white">Vulkan → ROCm / HIP</text>
<text x="522" y="413" class="body muted">Enumerate GPU; verify a tiny HIP workload.</text>
<text x="522" y="435" class="body" fill="#c4b5fd">RP1 after network + Vulkan · RP2 after HIP</text>
<!-- 05 -->
<g filter="url(#shadow)"><rect x="32" y="485" width="430" height="140" rx="16" fill="#152238" stroke="#4c4374"/><rect x="32" y="485" width="430" height="3" rx="1.5" fill="#8b5cf6"/></g>
<circle cx="61" cy="518" r="15" fill="#31265a"/><text x="61" y="522" class="step" fill="#c4b5fd" text-anchor="middle">05</text>
<text x="87" y="523" class="tiny" fill="#c4b5fd">PHASE 5</text>
<text x="54" y="561" class="title white">PyTorch + local inference</text>
<text x="54" y="588" class="body muted">Match ROCm build; confirm the backend.</text>
<text x="54" y="610" class="body" fill="#c4b5fd">Record latency + device behavior</text>
<!-- 06 -->
<g filter="url(#shadow)"><rect x="500" y="485" width="428" height="140" rx="16" fill="#152238" stroke="#735b31"/><rect x="500" y="485" width="428" height="3" rx="1.5" fill="#fbbf24"/></g>
<circle cx="529" cy="518" r="15" fill="#4a3815"/><text x="529" y="522" class="step" fill="#fde68a" text-anchor="middle">06</text>
<text x="555" y="523" class="tiny" fill="#fde68a">PHASE 6</text>
<text x="522" y="561" class="title white">Capture + OBS</text>
<text x="522" y="588" class="body muted">Test audio sync + sustained 1080p60.</text>
<rect x="522" y="598" width="166" height="20" rx="10" fill="#463512"/><text x="605" y="613" class="tiny" fill="#fde68a" text-anchor="middle">NOT YET VERIFIED</text>

<rect x="32" y="674" width="896" height="150" rx="16" fill="#101b2c" stroke="#293a54"/>
<text x="54" y="708" class="tiny" fill="#6ee7b7">RESTORE POINTS</text>
<text x="54" y="735" class="body muted">Save after verified milestones only.</text>
<path d="M74 768H884" stroke="#34534e" stroke-width="2"/>
<g fill="#34d399" stroke="#101b2c" stroke-width="4"><circle cx="120" cy="768" r="8"/><circle cx="360" cy="768" r="8"/><circle cx="600" cy="768" r="8"/><circle cx="840" cy="768" r="8"/></g>
<text x="120" y="797" class="tiny" fill="#6ee7b7" text-anchor="middle">RP0 · OS baseline</text>
<text x="360" y="797" class="tiny" fill="#6ee7b7" text-anchor="middle">RP1 · network + Vulkan</text>
<text x="600" y="797" class="tiny" fill="#6ee7b7" text-anchor="middle">RP2 · HIP success</text>
<text x="840" y="797" class="tiny" fill="#6ee7b7" text-anchor="middle">RP3 · inference</text>
<rect x="32" y="854" width="896" height="70" rx="14" fill="#131e30" stroke="#26354d"/>
<text x="54" y="883" class="tiny" fill="#93a4bd">SAFETY RAILS</text>
<text x="54" y="906" class="body muted">One change at a time · identify target disks · keep model weights outside OS restore images</text>
<text x="480" y="963" fill="#5f6f89" font-size="14" text-anchor="middle">Summary of docs/PLAN.md and current status records · Planned checkpoints are not proof of creation.</text>
</svg>